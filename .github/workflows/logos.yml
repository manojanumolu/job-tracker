name: Company Logos

# Finds each tracked company's own logo on its official website and keeps a
# small copy in logos.json (company_logos.py). Separate from Check Jobs on
# purpose: it never delays a scan or an email, and a failure here changes
# nothing else. Runs when companies.json changes (a company added or edited
# in the app), once a day for earlier misses, and on demand.
on:
  push:
    branches: [main]
    paths: [data/companies.json]
  schedule:
    - cron: "40 2 * * *"      # daily, 08:10 IST
  workflow_dispatch:

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

# one logo run at a time; its own group, so it never cancels a queued scan
concurrency:
  group: company-logos
  cancel-in-progress: false

jobs:
  # Loads the companies' websites (external content), so: read-only token,
  # no stored git credentials, no secret of any kind. Hands over logos.json only.
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements/requirements-logos.txt

      - name: Find company logos
        run: python src/company_logos.py

      - name: Hand logos.json to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logo-results
          path: data/logos.json
          if-no-files-found: error
          retention-days: 1

  # The only job that may push. It never loads an external site: it checks
  # the find job's logos.json (scan_handoff.py) and merges it in.
  publish:
    needs: find
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the logos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: logo-results
          path: logo-results

      - name: Take over logos.json
        run: python src/scan_handoff.py logo-results logos.json

      - name: Publish company logos
        env:
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python src/company_logos.py --publish-only

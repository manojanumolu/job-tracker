name: Check Jobs

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:          # allow manual run

# queue overlapping runs instead of letting them race each other's git push
concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so alerts.py can fetch and build on the latest branch tip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        id: scrape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper.py
        working-directory: .

      # Publish the scrape results and email new alerts — at most once per job.
      # alerts.py pushes the data (merged record-by-record with any change the
      # Streamlit app made meanwhile) and marks the jobs "claimed" BEFORE the
      # email goes out, then records "sent". A failed push therefore never
      # re-sends an alert, and if the first push fails nothing is emailed.
      - name: Publish results and send email alerts
        if: ${{ !cancelled() && steps.scrape.outcome == 'success' }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # private alert address; until this secret exists alerts.py falls
          # back to settings.json, so delivery never stops
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python alerts.py

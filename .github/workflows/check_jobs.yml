name: Check Jobs

# Two fixed schedules (GitHub cron lines are static); scan_schedule.py decides
# what each tick does, from settings.json (the admin's global scan interval:
# 1, 3, 6 or 12 h, default 3) and companies.json (when the last scan ran):
#   * twice an hour: a ~10 s plan job; the full scan starts only when one is due
#   * every 6 h: the personal-alert pass (no scan) — members are emailed at
#     most every 6 h whatever the scan interval is
# GitHub may start scheduled runs late or drop them (measured Oct 2026: 5 of
# ~17 "0 * * * *" ticks ran; none at all for 8 h on Oct 12). The real cadence
# comes from scan_scheduler.yml, a self-dispatching chain that sends a
# mode=plan dispatch when each window opens; the ticks below are the safety
# net, and every run restarts that chain if it has stopped (job "scheduler").
on:
  schedule:
    - cron: "17,47 * * * *"   # plan tick: scan when the admin's interval says so
    - cron: "20 */6 * * *"  # personal alerts every 6 hours (no scan)
  workflow_dispatch:          # "Run check": always scans
    inputs:
      mode:
        # "plan": what scan_scheduler.yml sends — scans only when one is due,
        # like the plan tick, so a duplicate never re-scans a window
        description: "scan = scan now; plan = scan only if the interval says one is due"
        type: choice
        options: [scan, plan]
        default: scan

# Nothing is granted by default; each job asks for exactly what it needs.
# Third-party actions are pinned to full commit SHAs (the tag in the comment)
# and Python packages to hashed lockfiles (requirements*.txt).
#
# Code and data are checked out apart (Nov 2026, docs/SECURITY_GITHUB.md):
# the code is the commit this run was started from; the data (data/*.json)
# is the tip of the data branch — the repository variable JT_DATA_BRANCH, or
# this run's branch when it is unset — in ./jt-data, read as JSON only and
# never imported or executed. Jobs that hold secrets run in the "production"
# environment, so its branch rules decide which refs may use them.
permissions: {}

# queue overlapping runs instead of letting them race each other's git push
concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scan: ${{ steps.plan.outputs.scan }}
      deliver: ${{ steps.plan.outputs.deliver }}
    steps:
      - name: Checkout the schedule code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/scan_schedule.py
          sparse-checkout-cone-mode: false

      - name: Checkout schedule inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the branch, not the commit the run was queued on: a run that
          # waited in the check-jobs queue behind a scan must see that scan's
          # companies.json, or it plans a second scan of the same window
          # (seen 2026-11-05 18:28 UTC, run 1224)
          ref: ${{ vars.JT_DATA_BRANCH || github.ref }}
          path: jt-data
          persist-credentials: false
          sparse-checkout: |
            data/settings.json
            data/companies.json
          sparse-checkout-cone-mode: false

      - name: Decide what this run does
        id: plan
        env:
          JT_DATA_ROOT: jt-data
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: python3 src/scan_schedule.py plan >> "$GITHUB_OUTPUT"

  # The scan reads external career sites (a headless browser and HTTP clients
  # loading content anyone could control), so it runs with a read-only token,
  # no stored git credentials and no secret of any kind. It hands only its two data files
  # to the publish job, as an artifact.
  scrape:
    needs: plan
    if: ${{ needs.plan.outputs.scan == 'true' }}
    runs-on: ubuntu-latest
    # a scan takes ~20-26 min (Nov 2026, 44 portals); a hung browser or site must not hold the check-jobs
    # group (and so every later scan) for GitHub's 6 h default. A timed-out
    # scan publishes and emails nothing; the next window scans again.
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.JT_DATA_BRANCH || github.ref }}       # the latest data, as the plan job saw it
          path: jt-data
          persist-credentials: false
          sparse-checkout: data
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      # required Chromium libraries and the browser are mandatory; extra fonts
      # are best effort: on 2026-11-11 an Ubuntu mirror outage failed every
      # scan for want of optional CJK/Thai/Cyrillic fonts (see the script)
      - name: Install Chromium and check that it launches
        run: bash .github/scripts/install-chromium.sh

      - name: Run scraper
        env:
          JT_DATA_ROOT: jt-data
        run: python src/scraper.py
        working-directory: .

      - name: Hand the results to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-results
          path: |
            jt-data/data/companies.json
            jt-data/data/seen_jobs.json
          if-no-files-found: error
          retention-days: 1

  # Publishes the scan and sends the alerts: the only job with write access
  # and the email secrets. It never loads an external site; it takes over the
  # scan job's two JSON files (checked by scan_handoff.py) and nothing else.
  publish:
    needs: [plan, scrape]
    if: ${{ !cancelled() && needs.scrape.result == 'success' }}
    runs-on: ubuntu-latest
    # git pushes + one email (~1 min) and the personal step (its own 10 min
    # cap); alerts.py claims before it sends, so a timeout never re-sends
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write

    steps:
      # the code that runs here, with no stored credentials: the push below
      # happens in the data checkout, whose files are never executed
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.JT_DATA_BRANCH || github.ref_name }}
          path: jt-data
          fetch-depth: 0   # full history so alerts.py can fetch and build on the latest branch tip

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Download the scan results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scan-results
          path: scan-results

      - name: Take over the scan results
        env:
          JT_DATA_ROOT: jt-data
        run: python src/scan_handoff.py scan-results companies.json seen_jobs.json

      # Publish the scrape results and email new alerts — at most once per job.
      # alerts.py pushes the data (merged record-by-record with any change the
      # Streamlit app made meanwhile) and marks the jobs "claimed" BEFORE the
      # email goes out, then records "sent". A failed push therefore never
      # re-sends an alert, and if the first push fails nothing is emailed.
      - name: Publish results and send email alerts
        if: ${{ !cancelled() }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # the private alert address (alerts.py reads nothing else)
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          PUBLISH_BRANCH: ${{ vars.JT_DATA_BRANCH || github.ref_name }}
          JT_DATA_ROOT: jt-data
        run: |
          git -C jt-data config user.name  "github-actions[bot]"
          git -C jt-data config user.email "github-actions[bot]@users.noreply.github.com"
          python src/alerts.py

      # Personal alerts (per-user, Phase 3): one email per person who turned
      # alerts on, from their own ledger in Firestore (claim -> send ->
      # finalize, so a job reaches each person at most once). It runs after
      # the shared step above and can never fail this job:
      # continue-on-error, a time limit, and one person's failure never stops
      # another. Until the FIREBASE_SERVICE_ACCOUNT secret exists it does
      # nothing and exits 0. Its log shows counts only — no address or UID.
      - name: Send personal email alerts
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JT_DATA_ROOT: jt-data
        run: python src/user_alerts.py --send

  # Safety net for the scan scheduler chain (scan_scheduler.yml): if no run
  # of it is queued or running, start one. Needs only the run's own token;
  # can never fail this workflow. Disabling the Scan scheduler workflow is
  # the off switch (the dispatch is then refused, which is fine here).
  scheduler:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Restart the scan scheduler if it has stopped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scan_scheduler.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          # none active (or can't tell): restart it — a duplicate only queues;
          # a restart shows up as a new Scan scheduler run
          if [ "${active:-0}" = "0" ]; then
            gh workflow run scan_scheduler.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

  # The 6-hourly personal pass: no scan, the same user_alerts.py as the last
  # step above (ledger claim -> send -> finalize; each person at most once per
  # 6 h). It can never fail the workflow.
  personal-alerts:
    needs: plan
    if: ${{ needs.plan.outputs.deliver == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.JT_DATA_BRANCH || github.ref }}
          path: jt-data
          persist-credentials: false
          sparse-checkout: data
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Send personal email alerts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JT_DATA_ROOT: jt-data
        run: python src/user_alerts.py --send

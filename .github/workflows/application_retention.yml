name: Application Tracker retention

# Permanently deletes Application Tracker records that have been in Recently
# deleted for more than 30 days (src/applications.py). The app already does
# this whenever an admin opens the tracker, and never shows or restores an
# expired record; this daily run makes sure the data goes even when nobody
# comes back. It reads no website, pushes nothing and logs only a count.
on:
  schedule:
    - cron: "35 21 * * *"     # daily, 03:05 IST
  workflow_dispatch:

# Nothing is granted by default; the job asks for exactly what it needs.
permissions: {}

concurrency:
  group: application-retention
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the Firebase key is a secret: only refs the "production" environment
    # allows may use it (docs/SECURITY_GITHUB.md)
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Delete applications past their 30 days in Recently deleted
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python src/applications.py --purge-expired

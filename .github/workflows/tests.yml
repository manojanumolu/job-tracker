name: Tests

on:
  push:
  pull_request:

# read-only; no secrets (pull requests from forks run this too)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # the suite took 9.5-14.5 min in Oct 2026 and twice hit a 15 min cap
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"   # same as check_jobs.yml
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements/requirements-dev.txt
          playwright install chromium --with-deps
      - name: Run tests
        run: python -m pytest -q

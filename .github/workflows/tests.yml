name: Tests

on:
  push:
  pull_request:

# read-only; no secrets (pull requests from forks run this too)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # the suite took 9.5-14.5 min in Oct 2026 and twice hit a 15 min cap
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"   # same as check_jobs.yml
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements/requirements-dev.txt
          playwright install chromium --with-deps
      - name: Run tests
        run: python -m pytest -q
